name: Sync Bekiuz AI to Hugging Face Space

on:
  push:
    branches: [huggingface-space]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4
        with:
          ref: huggingface-space

      - name: Check deployment secrets
        id: secrets-check
        shell: bash
        env:
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
          HF_SPACE_WRITE_TOKEN: ${{ secrets.HF_SPACE_WRITE_TOKEN }}
        run: |
          if [[ -z "$HF_SPACE_REPO" || -z "$HF_SPACE_WRITE_TOKEN" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sync skipped. Add HF_SPACE_REPO and HF_SPACE_WRITE_TOKEN in GitHub Actions secrets first."
          elif [[ ! "$HF_SPACE_REPO" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::HF_SPACE_REPO must be username/space-name, without a URL."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push app files to Space
        if: steps.secrets-check.outputs.ready == 'true'
        shell: bash
        env:
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
          HF_SPACE_WRITE_TOKEN: ${{ secrets.HF_SPACE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          git config --global credential.helper store
          printf 'https://user:%s@huggingface.co\n' "$HF_SPACE_WRITE_TOKEN" > "$HOME/.git-credentials"
          chmod 600 "$HOME/.git-credentials"
          git clone "https://huggingface.co/spaces/$HF_SPACE_REPO" hf-space
          cp README.md Dockerfile package.json server.js hf-space/
          rm -rf hf-space/public
          cp -R public hf-space/public
          cd hf-space
          git config user.name "Bekiuz AI Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md Dockerfile package.json server.js public
          if git diff --cached --quiet; then
            echo "Space already up to date."
            exit 0
          fi
          git commit -m "Sync Bekiuz AI from GitHub"
          git push
