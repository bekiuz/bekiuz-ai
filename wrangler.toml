name = "bekiuz-ai"
main = "src/index.js"
compatibility_date = "2026-10-10"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
OPENROUTER_MODEL = "openrouter/free"

# API key'ni ushbu faylga yozmang.
