name = "zuxrash-ai"
main = "src/index.js"
compatibility_date = "2026-10-10"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[vars]
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"

# Public Zuxrash AI endpoint protections.
[[ratelimits]]
name = "CLIENT_RATE_LIMITER"
namespace_id = "2026101003"

  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "NETWORK_RATE_LIMITER"
namespace_id = "2026101004"

  [ratelimits.simple]
  limit = 60
  period = 60
